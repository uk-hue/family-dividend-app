<!doctype html><html lang='ja'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><title>配当ポートフォリオ v1 Prototype</title><style>
:root{--bg:#f4f6f8;--card:#fff;--text:#17202a;--muted:#667085;--line:#e5e7eb;--accent:#176b4d;--accent2:#e9f5ef;--warn:#9a6700;--danger:#b42318}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;color:var(--text);font-size:18px}header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);padding:14px 18px;display:flex;gap:12px;align-items:center;justify-content:space-between}.brand{font-weight:800;font-size:20px}.filter{font-size:17px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fff}.wrap{max-width:1180px;margin:auto;padding:18px 18px 96px}.hero{background:linear-gradient(135deg,#fff,#edf7f2);border:1px solid #dcebe4;border-radius:20px;padding:22px}.eyebrow{color:var(--muted);font-weight:700}.big{font-size:44px;font-weight:850;letter-spacing:-1px;margin:6px 0}.subgrid,.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px}.metric,.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}.metric b{display:block;font-size:24px;margin-top:5px}.section{margin-top:22px}.section h2{font-size:22px;margin:0 0 12px}.progress{height:16px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin-top:8px}.progress>i{display:block;width:80.4%;height:100%;background:var(--accent)}.next{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}.next .card strong{font-size:20px}.chart{height:190px;display:flex;align-items:flex-end;gap:8px;padding:12px 4px 0}.bar{flex:1;background:#cfe7db;border-radius:7px 7px 0 0;min-height:12px;position:relative}.bar .month{position:absolute;bottom:-27px;width:100%;text-align:center;font-size:13px;color:var(--muted)}.bar .amount{position:absolute;top:-25px;width:100%;text-align:center;font-size:12px;font-weight:800;color:var(--text);white-space:nowrap}.piegrid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.piecard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px}.pie{width:180px;height:180px;border-radius:50%;margin:12px auto}.legend{display:grid;grid-template-columns:1fr;gap:8px;font-size:15px;margin-top:12px}.legend span{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 8px;border-radius:9px;background:#fafafa}.legend .label{display:flex;align-items:center;gap:8px}.legend .swatch{width:14px;height:14px;border-radius:4px;flex:0 0 14px}.legend strong{font-size:15px}.c1{background:#a9d6c7}.c2{background:#f3c7b8}.c3{background:#c8d7f0}.c4{background:#f5dda8}.c5{background:#d8c9e8}.pie1{background:conic-gradient(#a9d6c7 0 31%,#f3c7b8 31% 51%,#c8d7f0 51% 69%,#f5dda8 69% 84%,#d8c9e8 84% 100%)}.pie2{background:conic-gradient(#a9d6c7 0 29%,#f3c7b8 29% 54%,#c8d7f0 54% 71%,#f5dda8 71% 86%,#d8c9e8 86% 100%)}.pie3{background:conic-gradient(#a9d6c7 0 42%,#c8d7f0 42% 100%)}.pie4{background:conic-gradient(#f5dda8 0 36%,#c8d7f0 36% 100%)}nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;z-index:10}.navin{width:min(100%,800px);display:grid;grid-template-columns:repeat(5,1fr)}nav button{border:0;background:#fff;padding:13px 5px;font-size:14px;color:#475467}nav button.active{color:var(--accent);font-weight:800}.fab{position:fixed;right:22px;bottom:82px;width:62px;height:62px;border-radius:50%;border:0;background:var(--accent);color:white;font-size:34px;box-shadow:0 8px 24px #0003}.pill{display:inline-block;border-radius:99px;padding:5px 9px;background:var(--accent2);color:var(--accent);font-size:14px;font-weight:700}.muted{color:var(--muted)}table{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden}th,td{padding:13px 10px;border-bottom:1px solid var(--line);text-align:right}th:first-child,td:first-child{text-align:left}.hide{display:none}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}.toolbar button{font-size:16px;padding:10px 13px;border:1px solid var(--line);border-radius:10px;background:#fff}.modal{position:fixed;inset:0;background:#0008;z-index:30;display:none;align-items:flex-end;justify-content:center}.sheet{width:min(100%,600px);background:#fff;border-radius:22px 22px 0 0;padding:22px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions button{padding:18px;border:1px solid var(--line);background:#fff;border-radius:14px;font-size:18px}.close{width:100%;margin-top:12px;padding:14px;border:0;border-radius:12px;font-size:17px}.tag-hi{color:#8a3b00;background:#fff1e7}.tag-div{color:#176b4d;background:#e9f5ef}.tag-none{color:#475467;background:#f2f4f7}@media(max-width:800px){body{font-size:17px}.piegrid{grid-template-columns:1fr 1fr}.pie{width:150px;height:150px}.wrap{padding:14px 12px 96px}.big{font-size:38px}.subgrid,.cards{grid-template-columns:1fr 1fr}.next{grid-template-columns:1fr}.desktop{display:none}header{padding:12px}.brand{font-size:18px}.hero{padding:18px}}@media(max-width:430px){.piegrid{grid-template-columns:1fr}.pie{width:180px;height:180px}.subgrid{grid-template-columns:1fr 1fr}.metric{padding:13px}.metric b{font-size:20px}.big{font-size:36px}}

.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;font-size:14px;color:var(--muted);font-weight:700;margin-bottom:5px}.field input,.field select{width:100%;font-size:17px;padding:11px;border:1px solid var(--line);border-radius:10px;background:#fff}.wide{grid-column:1/-1}.primary{background:var(--accent)!important;color:#fff!important;border:0!important}.dangerbtn{color:var(--danger)}.rowactions button{font-size:13px;padding:5px 8px;margin-left:4px}.notice{padding:10px 12px;border-radius:10px;background:#fff8e6;color:#7a5200;font-size:14px;margin:10px 0}.mini{font-size:14px}.empty{padding:24px;text-align:center;color:var(--muted)}@media(max-width:600px){.formgrid{grid-template-columns:1fr}.wide{grid-column:auto}.amount{font-size:10px!important}}

.authscreen{position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}.authcard{width:min(100%,480px);background:#fff;border:1px solid var(--line);border-radius:22px;padding:24px}.authcard h1{font-size:26px;margin:0 0 8px}.authcard input{width:100%;font-size:17px;padding:12px;border:1px solid var(--line);border-radius:10px;margin:6px 0 12px}.statusbox{margin-top:14px;padding:12px;border-radius:10px;background:#f2f4f7;font-size:14px}.userbar{font-size:13px;color:var(--muted)}
.importbox{border:1px dashed #9bbbad;background:#f7fbf9;border-radius:14px;padding:16px}.importpreview{overflow:auto;max-height:420px;margin-top:12px}.importpreview table{font-size:13px;min-width:1050px}.importpreview th,.importpreview td{padding:8px 7px;white-space:nowrap}.okrow{background:#f2fbf6}.warnrow{background:#fff8e6}.errorrow{background:#fff0ef}.status-ok{color:#176b4d;font-weight:800}.status-warn{color:#9a6700;font-weight:800}.status-error{color:#b42318;font-weight:800}.import-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.import-actions button{padding:11px 14px;border-radius:10px;border:1px solid var(--line);font-size:15px}.filelabel{display:inline-block;padding:12px 14px;border-radius:10px;background:#fff;border:1px solid var(--line);cursor:pointer;font-weight:700}.filelabel input{display:none}
</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#17785a"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="配当ポートフォリオ">
<link rel="apple-touch-icon" href="./icons/icon-180.png"></head><body>
<div class="authscreen" id="authScreen"><div class="authcard"><h1>配当ポートフォリオ</h1><p class="muted">Excel取込対応 v0.8</p><div id="setupBox"><div class="field"><label>Project URL</label><input id="sbUrl" placeholder="https://xxxxx.supabase.co"></div><div class="field"><label>Publishable key</label><input id="sbKey" type="password" placeholder="sb_publishable_..."></div><button class="primary close" id="saveConnection">接続設定を保存</button><div class="notice">Secret key / service_role key は入力しないでください。</div></div><div id="loginBox" class="hide"><div class="field"><label>メールアドレス</label><input id="loginEmail" type="email" autocomplete="username"></div><div class="field"><label>パスワード</label><input id="loginPassword" type="password" autocomplete="current-password"></div><button class="primary close" id="loginBtn">ログイン</button><button class="close" id="changeConnection">接続設定を変更</button></div><div class="statusbox" id="authStatus">接続設定を入力してください。</div></div></div>
<header><div><div class="brand">配当ポートフォリオ <span class="mini muted">Excel取込対応 v0.8</span></div><div class="userbar" id="userBar"></div></div><div style="display:flex;gap:8px;align-items:center"><select id="memberFilter" class="filter"></select><button id="logoutBtn" class="filter">ログアウト</button></div></header>
<div class="wrap">
<section id="home"></section>
<section id="portfolio" class="hide"></section>
<section id="dividend" class="hide"></section>
<section id="analysis" class="hide"></section>
<section id="settings" class="hide"></section>
</div>
<button class="fab" id="fab">＋</button>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<nav><div class="navin"><button class="active" data-page="home">ホーム</button><button data-page="portfolio">資産</button><button data-page="dividend">配当</button><button data-page="analysis">分析</button><button data-page="settings">設定</button></div></nav>
<script>
const KEY='dividendAppV01';
const CONN_KEY='dividendAppSupabaseConnection';
let sb=null;
let remoteContext=null;
let remoteMode=false;
const seed={settings:{usdJpy:150,goal:600000,highYield:4},members:['Member A','Member B','Member C'],accounts:[
{id:'a1',member:'Member A',broker:'Webull',type:'特定'},{id:'a2',member:'Member A',broker:'SBI証券',type:'NISA'},{id:'a3',member:'Member B',broker:'楽天証券',type:'特定'},{id:'a4',member:'Member C',broker:'SBI証券',type:'NISA'}],
assets:[
{id:'ko',ticker:'KO',name:'Coca-Cola',kind:'米国株',sector:'生活必需品',currency:'USD',price:70,annualPerShare:2.04,frequency:4,months:[3,6,9,12]},
{id:'vym',ticker:'VYM',name:'Vanguard High Dividend Yield ETF',kind:'ETF',sector:'ETF/投信',currency:'USD',price:145,annualPerShare:3.6,frequency:4,months:[3,6,9,12]},
{id:'pbr',ticker:'PBR',name:'Petrobras',kind:'米国株',sector:'エネルギー',currency:'USD',price:16,annualPerShare:1.2,frequency:4,months:[3,6,9,12]},
{id:'brkb',ticker:'BRK.B',name:'Berkshire Hathaway',kind:'米国株',sector:'金融',currency:'USD',price:500,annualPerShare:0,frequency:0,months:[]},
{id:'ntt',ticker:'9432',name:'NTT',kind:'日本株',sector:'情報通信',currency:'JPY',price:160,annualPerShare:5.4,frequency:2,months:[6,12]}],
transactions:[
{id:'t1',assetId:'ko',accountId:'a1',type:'initial',date:'2026-01-01',qty:100,price:55.2,fund:'通常資金',cancelled:false},
{id:'t2',assetId:'vym',accountId:'a2',type:'initial',date:'2026-01-01',qty:50,price:120,fund:'通常資金',cancelled:false},
{id:'t3',assetId:'pbr',accountId:'a1',type:'initial',date:'2026-01-01',qty:100,price:12,fund:'通常資金',cancelled:false},
{id:'t4',assetId:'brkb',accountId:'a1',type:'initial',date:'2026-01-01',qty:5,price:410,fund:'通常資金',cancelled:false},
{id:'t5',assetId:'ntt',accountId:'a3',type:'initial',date:'2026-01-01',qty:1000,price:145,fund:'通常資金',cancelled:false}],
dividends:[
{id:'d1',assetId:'ntt',accountId:'a3',date:'2026-09-20',status:'actual',gross:2700,net:2600,currency:'JPY',fx:1,cancelled:false},
{id:'d2',assetId:'ko',accountId:'a1',date:'2026-09-30',status:'planned',gross:51,net:40.65,currency:'USD',fx:150,cancelled:false},
{id:'d3',assetId:'vym',accountId:'a2',date:'2026-10-03',status:'planned',gross:54.7,net:54.7,currency:'USD',fx:150,cancelled:false}],
priceUpdated:'2026-09-26'};
let db=JSON.parse(localStorage.getItem(KEY)||'null')||structuredClone(seed); let filter='ALL';
const yen=n=>'¥'+Math.round(n||0).toLocaleString('ja-JP'); const money=(n,c)=>c==='USD'?'$'+Number(n||0).toFixed(2):yen(n);
function save(){if(!remoteMode)localStorage.setItem(KEY,JSON.stringify(db)); renderAll()}
function acct(id){return db.accounts.find(x=>x.id===id)} function asset(id){return db.assets.find(x=>x.id===id)}
function inFilter(accountId){let a=acct(accountId);return filter==='ALL'||(a&&a.member===filter)}
function holdings(){let m={};db.transactions.filter(t=>!t.cancelled&&inFilter(t.accountId)).forEach(t=>{let k=t.assetId+'|'+t.accountId;if(!m[k])m[k]={assetId:t.assetId,accountId:t.accountId,qty:0,cost:0};let s=t.type==='sell'?-1:1;m[k].qty+=s*t.qty;m[k].cost+=s*t.qty*t.price});return Object.values(m).filter(h=>h.qty>0.000001)}
function fx(a){return a.currency==='USD'?db.settings.usdJpy:1} function valueY(h){let a=asset(h.assetId);return h.qty*a.price*fx(a)} function annualY(h){let a=asset(h.assetId);return h.qty*a.annualPerShare*fx(a)}
function totals(){let hs=holdings(), val=hs.reduce((s,h)=>s+valueY(h),0), annual=hs.reduce((s,h)=>s+annualY(h),0), incomeVal=hs.filter(h=>asset(h.assetId).annualPerShare>0).reduce((s,h)=>s+valueY(h),0);let cost=hs.reduce((s,h)=>{let a=asset(h.assetId);return s+h.cost*fx(a)},0);let actual=db.dividends.filter(d=>!d.cancelled&&d.status==='actual'&&inFilter(d.accountId)).reduce((s,d)=>s+d.net*d.fx,0);return{hs,val,annual,incomeVal,cost,actual}}
function renderFilter(){memberFilter.innerHTML='<option value="ALL">家族全体</option>'+db.members.map(m=>`<option>${m}</option>`).join('');memberFilter.value=filter}
function renderHome(){let t=totals(), hi=t.hs.filter(h=>{let a=asset(h.assetId);return a.annualPerShare>0&&annualY(h)/valueY(h)*100>=db.settings.highYield}).reduce((s,h)=>s+valueY(h),0);let lo=t.incomeVal-hi;let months=Array(12).fill(0);db.dividends.filter(d=>!d.cancelled&&inFilter(d.accountId)).forEach(d=>months[new Date(d.date+'T00:00').getMonth()]+=d.net*d.fx);let max=Math.max(...months,1);let next=db.dividends.filter(d=>!d.cancelled&&d.status==='planned'&&inFilter(d.accountId)).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,3);home.innerHTML=`<div class="hero"><div class="eyebrow">2026年 年間配当・分配金見込</div><div class="big">${yen(t.annual)}</div><div class="muted">現在保有ベースの年換算</div><div class="subgrid"><div class="metric">現在ペース年換算<b>${yen(t.annual)}</b></div><div class="metric">今年受取済み<b>${yen(t.actual)}</b></div><div class="metric">配当関連資産<b>${yen(t.incomeVal)}</b></div><div class="metric">総資産評価額<b>${yen(t.val)}</b></div></div></div><div class="cards"><div class="card"><span class="pill tag-hi">高配当 ≥${db.settings.highYield}%</span><h3>${yen(hi)}</h3></div><div class="card"><span class="pill tag-div">配当あり &lt;${db.settings.highYield}%</span><h3>${yen(lo)}</h3></div><div class="card"><div class="muted">投資元本</div><h3>${yen(t.cost)}</h3><div>評価損益 ${yen(t.val-t.cost)}</div></div><div class="card"><div class="muted">登録銘柄</div><h3>${t.hs.length}</h3><div>保有ポジション</div></div></div><div class="section"><h2>年間目標</h2><div class="card"><strong>${yen(t.annual)} / ${yen(db.settings.goal)}</strong><span style="float:right">${(t.annual/db.settings.goal*100).toFixed(1)}%</span><div class="progress"><i style="width:${Math.min(100,t.annual/db.settings.goal*100)}%"></i></div></div></div><div class="section"><h2>次の配当</h2><div class="next">${next.length?next.map(d=>`<div class="card"><strong>${d.date.slice(5).replace('-','/')} ${asset(d.assetId).ticker}</strong><div>予定 約 ${yen(d.net*d.fx)}</div><div class="muted">${money(d.gross,d.currency)}</div></div>`).join(''):'<div class="card">予定なし</div>'}</div></div><div class="section"><h2>月別 配当・分配金</h2><div class="card"><div class="chart">${months.map((v,i)=>`<div class="bar" style="height:${Math.max(8,v/max*100)}%"><span class="amount">${yen(v)}</span><span class="month">${i+1}月</span></div>`).join('')}</div></div></div>`}
function renderPortfolio(){let t=totals();let totalVal=t.val||0;portfolio.innerHTML=`<div class="section"><h2>ポートフォリオ</h2><div class="cards" style="grid-template-columns:repeat(2,minmax(0,1fr));margin-bottom:12px"><div class="metric"><span class="eyebrow">資産評価額 合計</span><b>${yen(totalVal)}</b></div><div class="metric"><span class="eyebrow">保有銘柄・口座数</span><b>${t.hs.length}</b></div></div><div class="notice">現在価格は手入力です。設定画面から更新できます。</div><table><thead><tr><th>銘柄</th><th>口座</th><th>株数</th><th>評価額</th><th>構成比</th><th>年間配当</th><th>利回り</th></tr></thead><tbody>${t.hs.map(h=>{let a=asset(h.assetId),ac=acct(h.accountId),v=valueY(h),share=totalVal?v/totalVal*100:0,y=v?annualY(h)/v*100:0,tag=a.annualPerShare===0?'無配':y>=db.settings.highYield?'高配当':'配当あり';return `<tr><td>${a.ticker} <span class="pill ${tag==='高配当'?'tag-hi':tag==='無配'?'tag-none':'tag-div'}">${tag}</span><div class="mini muted">${a.name}</div></td><td>${ac.member}<div class="mini muted">${ac.broker} ${ac.type}</div></td><td>${h.qty}</td><td>${yen(v)}</td><td><strong>${share.toFixed(1)}%</strong></td><td>${yen(annualY(h))}</td><td>${a.annualPerShare?y.toFixed(2)+'%':'—'}</td></tr>`}).join('')}</tbody></table></div>`}
function renderDividend(){
 let ds=db.dividends.filter(d=>!d.cancelled&&inFilter(d.accountId)).sort((a,b)=>a.date.localeCompare(b.date));
 dividend.innerHTML=`<div class="section"><h2>配当・分配金</h2>${ds.length?ds.map(d=>{
   const isActual=d.status==='actual', isReceived=d.status==='planned'&&d.scheduleStatus==='受取済';
   const label=isActual?'実績・受取済':isReceived?'予定・✓受取済':'予定';
   let actions='';
   if(d.status==='planned'&&!isReceived) actions=`<button onclick="receiveDividend('${d.id}')">受取済みにする</button><button onclick="cancelDividend('${d.id}')">取消</button>`;
   if(isActual) actions=`<button onclick="cancelDividend('${d.id}')">実績を取消</button>`;
   return `<div class="card" style="margin-bottom:10px"><strong>${d.date}　${asset(d.assetId).ticker}</strong><div>${label}　${yen(d.net*d.fx)} <span class="muted">(${money(d.gross,d.currency)})</span></div>${actions?`<div class="rowactions">${actions}</div>`:''}</div>`;
 }).join(''):'<div class="empty">配当データなし</div>'}</div>`;
}
function renderAnalysis(){let t=totals();let groups={};t.hs.forEach(h=>{let a=asset(h.assetId);groups[a.sector]=(groups[a.sector]||0)+valueY(h)});let arr=Object.entries(groups).sort((a,b)=>b[1]-a[1]), total=t.val||1;let colors=['#a9d6c7','#f3c7b8','#c8d7f0','#f5dda8','#d8c9e8','#bcded7'];let cur=0,stops=arr.map(([k,v],i)=>{let p=v/total*100,s=`${colors[i%colors.length]} ${cur}% ${cur+p}%`;cur+=p;return s}).join(',');analysis.innerHTML=`<div class="section"><h2>分析</h2><div class="piegrid"><div class="piecard"><h3>資産構成比</h3><div class="pie" style="background:conic-gradient(${stops||'#eee 0 100%'})"></div><div class="legend">${arr.map(([k,v],i)=>`<span><span class="label"><i class="swatch" style="background:${colors[i%colors.length]}"></i>${k}</span><strong>${yen(v)}　${(v/total*100).toFixed(1)}%</strong></span>`).join('')}</div></div><div class="piecard"><h3>配当資産区分</h3><div class="card"><p>配当関連資産 <strong>${yen(t.incomeVal)}</strong></p><p>総資産 <strong>${yen(t.val)}</strong></p><p>配当資産比率 <strong>${(t.incomeVal/(t.val||1)*100).toFixed(1)}%</strong></p></div></div></div></div>`}
function renderSettings(){settings.innerHTML=`<div class="section"><h2>設定</h2><div class="card"><div class="formgrid"><div class="field"><label>高配当判定基準 (%)</label><input id="setYield" type="number" step="0.1" value="${db.settings.highYield}"></div><div class="field"><label>予定用 USD/JPY</label><input id="setFx" type="number" step="0.01" value="${db.settings.usdJpy}"></div><div class="field"><label>年間配当目標 (円)</label><input id="setGoal" type="number" value="${db.settings.goal}"></div><div class="wide"><button class="primary close" onclick="saveSettings()">設定を保存</button></div></div></div>

let pendingImportRows=[];
const IMPORT_HEADERS=['誰の資産？','資産種別','証券会社','口座区分','市場','銘柄コード・ファンド名','銘柄名（任意）','現在の保有数量','平均取得単価・取得価額','取得通貨','取得金額（任意）','メモ'];
function bindImportUI(){
 const f=document.getElementById('assetImportFile'),c=document.getElementById('importCommitBtn'),x=document.getElementById('importClearBtn');
 if(f)f.onchange=handleAssetImportFile;if(c)c.onclick=commitAssetImport;if(x)x.onclick=clearAssetImport;
}
function clearAssetImport(){pendingImportRows=[];const p=document.getElementById('importPreview'),s=document.getElementById('importSummary'),f=document.getElementById('assetImportFile'),n=document.getElementById('importFileName'),b=document.getElementById('importCommitBtn');if(p)p.innerHTML='';if(s)s.innerHTML='';if(f)f.value='';if(n)n.textContent='未選択';if(b)b.disabled=true;}
function normText(v){return String(v??'').trim()}
function normNum(v){if(v===null||v===undefined||v==='')return NaN;return Number(String(v).replace(/,/g,''))}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function handleAssetImportFile(e){
 const file=e.target.files?.[0];if(!file)return;document.getElementById('importFileName').textContent=file.name;
 if(typeof XLSX==='undefined'){alert('Excel読込ライブラリを読み込めません。インターネット接続を確認してください。');return;}
 try{
  const buf=await file.arrayBuffer(),book=XLSX.read(buf,{type:'array'});const sheet=book.Sheets['初期資産入力']||book.Sheets[book.SheetNames[0]];
  const rows=XLSX.utils.sheet_to_json(sheet,{defval:'',raw:true});
  pendingImportRows=validateImportRows(rows);renderImportPreview();
 }catch(err){pendingImportRows=[];document.getElementById('importPreview').innerHTML='<div class="notice">読込エラー：'+esc(err.message)+'</div>';document.getElementById('importCommitBtn').disabled=true;}
}
function validateImportRows(rows){
 const memberByName=Object.fromEntries((remoteContext?.members||[]).map(m=>[m.display_name,m]));
 return rows.filter(r=>IMPORT_HEADERS.some(h=>normText(r[h]))).map((r,i)=>{
  const x={rowNo:i+2,memberName:normText(r['誰の資産？']),assetType:normText(r['資産種別']),broker:normText(r['証券会社']),accountType:normText(r['口座区分']),market:normText(r['市場']),symbol:normText(r['銘柄コード・ファンド名']),name:normText(r['銘柄名（任意）']),qty:normNum(r['現在の保有数量']),price:normNum(r['平均取得単価・取得価額']),currency:normText(r['取得通貨']),amount:normNum(r['取得金額（任意）']),memo:normText(r['メモ']),errors:[],warnings:[]};
  if(!memberByName[x.memberName])x.errors.push('家族名が未登録');
  if(!['個別株','ETF','投資信託'].includes(x.assetType))x.errors.push('資産種別');
  if(!x.broker)x.errors.push('証券会社');if(!x.accountType)x.errors.push('口座区分');if(!x.symbol)x.errors.push('コード/ファンド名');
  if(!(x.qty>0))x.errors.push('保有数量');if(!(x.price>=0))x.errors.push('取得単価');if(!['円','USD'].includes(x.currency))x.errors.push('通貨');
  x.member=memberByName[x.memberName];
  const existingAccount=db.accounts.find(a=>a.memberId===x.member?.id&&a.broker===x.broker&&a.type===x.accountType);
  const existingAsset=db.assets.find(a=>String(a.ticker).toLowerCase()===x.symbol.toLowerCase());
  if(existingAccount&&existingAsset&&db.transactions.some(t=>t.accountId===existingAccount.id&&t.assetId===existingAsset.id&&!t.cancelled))x.errors.push('既存取引あり（重複防止）');
  if(x.assetType==='投資信託'&&!x.name)x.warnings.push('銘柄名はファンド名を使用');
  return x;
 });
}
function renderImportPreview(){
 const el=document.getElementById('importPreview'),sum=document.getElementById('importSummary'),btn=document.getElementById('importCommitBtn');
 const err=pendingImportRows.filter(x=>x.errors.length).length,warn=pendingImportRows.filter(x=>!x.errors.length&&x.warnings.length).length,ok=pendingImportRows.length-err;
 sum.innerHTML=`読込 <strong>${pendingImportRows.length}</strong>件 ／ 登録可能 <strong>${ok}</strong>件 ／ エラー <strong>${err}</strong>件${warn?` ／ 注意 ${warn}件`:''}`;
 if(!pendingImportRows.length){el.innerHTML='<div class="empty">入力データがありません。</div>';btn.disabled=true;return;}
 el.innerHTML=`<table><thead><tr><th>行</th><th>判定</th><th>家族</th><th>種別</th><th>証券会社</th><th>口座</th><th>コード/ファンド</th><th>数量</th><th>取得単価</th><th>通貨</th><th>メモ</th></tr></thead><tbody>${pendingImportRows.map(x=>{let cls=x.errors.length?'errorrow':x.warnings.length?'warnrow':'okrow',status=x.errors.length?`<span class="status-error">要修正：${esc(x.errors.join('・'))}</span>`:x.warnings.length?`<span class="status-warn">OK（${esc(x.warnings.join('・'))}）</span>`:'<span class="status-ok">OK</span>';return `<tr class="${cls}"><td>${x.rowNo}</td><td>${status}</td><td>${esc(x.memberName)}</td><td>${esc(x.assetType)}</td><td>${esc(x.broker)}</td><td>${esc(x.accountType)}</td><td>${esc(x.symbol)}</td><td>${x.qty}</td><td>${x.price}</td><td>${esc(x.currency)}</td><td>${esc(x.memo)}</td></tr>`}).join('')}</tbody></table>`;
 btn.disabled=!!err||!ok||!remoteMode;
}
async function commitAssetImport(){
 if(!remoteMode||!remoteContext)return alert('Supabaseログイン後に実行してください。');if(!pendingImportRows.length||pendingImportRows.some(x=>x.errors.length))return alert('エラー行を修正してExcelを読み直してください。');
 if(!confirm(`${pendingImportRows.length}件の初期資産をSupabaseへ登録します。よろしいですか？`))return;
 const btn=document.getElementById('importCommitBtn');btn.disabled=true;btn.textContent='登録中…';
 try{
  const fid=remoteContext.family.id,uid=remoteContext.user.id, accountCache=new Map(), securityCache=new Map();
  for(const a of db.accounts)accountCache.set(`${a.memberId}|${a.broker}|${a.type}`,a.id);
  for(const a of db.assets)securityCache.set(String(a.ticker).toLowerCase(),a.id);
  for(const x of pendingImportRows){
   const akey=`${x.member.id}|${x.broker}|${x.accountType}`;let accountId=accountCache.get(akey);
   if(!accountId){const {data,error}=await sb.from('brokerage_accounts').insert({family_id:fid,member_id:x.member.id,broker_name:x.broker,account_name:x.accountType,account_type:x.accountType,currency:x.currency==='円'?'JPY':x.currency,is_active:true}).select().single();if(error)throw new Error(`行${x.rowNo} 口座：${error.message}`);accountId=data.id;accountCache.set(akey,accountId);}
   const skey=x.symbol.toLowerCase();let securityId=securityCache.get(skey);
   if(!securityId){let kind=x.assetType==='個別株'?(x.market||'個別株'):x.assetType;const {data,error}=await sb.from('securities').insert({family_id:fid,symbol:x.symbol,name:x.name||x.symbol,asset_type:kind,currency:x.currency==='円'?'JPY':x.currency,sector:x.assetType==='ETF'||x.assetType==='投資信託'?'ETF/投信':'未分類',current_price:x.price,annual_dividend_per_share:0,dividend_frequency:0,dividend_status:'未設定',is_active:true}).select().single();if(error)throw new Error(`行${x.rowNo} 銘柄：${error.message}`);securityId=data.id;securityCache.set(skey,securityId);}
   const {error:te}=await sb.from('transactions').insert({family_id:fid,member_id:x.member.id,account_id:accountId,security_id:securityId,transaction_type:'initial',trade_date:new Date().toLocaleDateString('sv-SE'),quantity:x.qty,price:x.price,currency:x.currency==='円'?'JPY':x.currency,funding_source:'通常資金',status:'active',created_by:uid});if(te)throw new Error(`行${x.rowNo} 初期残高：${te.message}`);
  }
  await loadRemoteData();pendingImportRows=[];alert('初期資産をSupabaseへ登録しました。');
 }catch(err){alert('登録を中止しました。途中まで登録された可能性があります。\n'+err.message+'\n再実行前に資産画面を確認してください。');await loadRemoteData();}
 finally{const b=document.getElementById('importCommitBtn');if(b){b.textContent='Supabaseへ登録';b.disabled=true;}}
}

async function loadRemoteData(){
  if(!remoteContext)return;
  const [mres,ares,sres,tres,dsres,dpres,setres,goalres]=await Promise.all([
    sb.from('family_members').select('id,display_name').eq('family_id',remoteContext.family.id),
    sb.from('brokerage_accounts').select('*').eq('family_id',remoteContext.family.id).eq('is_active',true),
    sb.from('securities').select('*').eq('family_id',remoteContext.family.id).eq('is_active',true),
    sb.from('transactions').select('*').eq('family_id',remoteContext.family.id).eq('status','active'),
    sb.from('dividend_schedules').select('*').eq('family_id',remoteContext.family.id).neq('status','取消'),
    sb.from('dividend_payments').select('*').eq('family_id',remoteContext.family.id).eq('status','active'),
    sb.from('family_settings').select('*').eq('family_id',remoteContext.family.id).maybeSingle(),
    sb.from('dividend_goals').select('*').eq('family_id',remoteContext.family.id).eq('year',2026).maybeSingle()
  ]);
  const err=[mres,ares,sres,tres,dsres,dpres].find(x=>x.error)?.error;if(err){alert('Supabaseデータ読込エラー：'+err.message);return;}
  remoteContext.members=(mres.data||[]);
  const memberMap=Object.fromEntries((mres.data||[]).map(x=>[x.id,x.display_name]));
  db={settings:{usdJpy:+(setres.data?.usd_jpy_planning_rate||150),goal:+(goalres.data?.target_amount_jpy||0),highYield:+(setres.data?.high_dividend_threshold||4)},members:(mres.data||[]).map(x=>x.display_name),accounts:(ares.data||[]).map(x=>({id:x.id,member:memberMap[x.member_id]||'Member',memberId:x.member_id,broker:x.broker_name,type:x.account_type,currency:x.currency})),assets:(sres.data||[]).map(x=>({id:x.id,ticker:x.symbol,name:x.name,kind:x.asset_type,sector:x.sector||'未分類',currency:x.currency,price:+x.current_price,annualPerShare:+x.annual_dividend_per_share,frequency:x.dividend_frequency||0,months:[]})),transactions:(tres.data||[]).map(x=>({id:x.id,assetId:x.security_id,accountId:x.account_id,type:x.transaction_type,date:x.trade_date,qty:+x.quantity,price:+x.price,fund:x.funding_source,cancelled:false})),dividends:[
    ...(dsres.data||[]).map(x=>({id:x.id,assetId:x.security_id,accountId:x.account_id,date:x.expected_date,status:'planned',gross:+x.gross_amount,net:+(x.estimated_net_amount??x.gross_amount),currency:x.currency,fx:x.currency==='JPY'?1:+(x.estimated_fx_rate||db?.settings?.usdJpy||150),cancelled:false,scheduleStatus:x.status})),
    ...(dpres.data||[]).map(x=>({id:x.id,assetId:x.security_id,accountId:x.account_id,date:x.payment_date,status:'actual',gross:+x.gross_amount,net:+x.net_amount,currency:x.currency,fx:x.currency==='JPY'?1:+(x.fx_rate||1),cancelled:false,distributionType:x.distribution_type||'配当'}))
  ],priceUpdated:new Date().toISOString().slice(0,10)};
  remoteMode=true;filter='ALL';renderAll();
}

async function initSupabase(){
  const cfg=JSON.parse(localStorage.getItem(CONN_KEY)||'null');
  if(!cfg?.url||!cfg?.key){authStatus.textContent='接続設定を入力してください。';setupBox.classList.remove('hide');loginBox.classList.add('hide');return;}
  try{
    sb=window.supabase.createClient(cfg.url,cfg.key);
    setupBox.classList.add('hide');loginBox.classList.remove('hide');
    authStatus.textContent='接続設定済み。ログインしてください。';
    const {data:{session}}=await sb.auth.getSession();
    if(session) await afterLogin(session.user);
  }catch(e){authStatus.textContent='接続設定を確認してください：'+e.message;}
}
async function afterLogin(user){
  authStatus.textContent='ログイン確認中…';
  const {data:member,error}=await sb.from('family_members').select('id,family_id,display_name,role').eq('user_id',user.id).single();
  if(error){authStatus.textContent='ログインは成功しましたが、Member情報を取得できません：'+error.message;return;}
  const {data:family,error:ferr}=await sb.from('families').select('id,name').eq('id',member.family_id).single();
  if(ferr){authStatus.textContent='Family情報を取得できません：'+ferr.message;return;}
  remoteContext={user,member,family};
  userBar.textContent=`${member.display_name} ｜ ${family.name} ｜ ${member.role}`;
  authScreen.style.display='none';
  await loadRemoteData();
  renderAll();
}
saveConnection.onclick=()=>{
  const url=sbUrl.value.trim().replace(/\/rest\/v1\/?$/,''); const key=sbKey.value.trim();
  if(!url.startsWith('https://')||!key.startsWith('sb_publishable_')) return alert('Project URL と Publishable key を確認してください。');
  localStorage.setItem(CONN_KEY,JSON.stringify({url,key})); location.reload();
};
changeConnection.onclick=()=>{localStorage.removeItem(CONN_KEY);location.reload()};
loginBtn.onclick=async()=>{
  if(!sb)return; authStatus.textContent='ログイン中…';
  const {data,error}=await sb.auth.signInWithPassword({email:loginEmail.value.trim(),password:loginPassword.value});
  if(error){authStatus.textContent='ログインできません：'+error.message;return;}
  await afterLogin(data.user);
};
logoutBtn.onclick=async()=>{if(sb)await sb.auth.signOut();remoteContext=null;userBar.textContent='';authScreen.style.display='flex';loginBox.classList.remove('hide');authStatus.textContent='ログアウトしました。';};
renderAll();
initSupabase();
