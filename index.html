ding:10px 13px;border:1px solid var(--line);border-radius:10px;background:#fff}.modal{position:fixed;inset:0;background:#0008;z-index:30;display:none;align-items:flex-end;justify-content:center}.sheet{width:min(100%,600px);background:#fff;border-radius:22px 22px 0 0;padding:22px;max-height:88vh;overflow-y:auto;-webkit-overflow-scrolling:touch}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions button{padding:18px;border:1px solid var(--line);background:#fff;border-radius:14px;font-size:18px}.close{width:100%;margin-top:12px;padding:14px;border:0;border-radius:12px;font-size:17px}.tag-hi{color:#8a3b00;background:#fff1e7}.tag-div{color:#176b4d;background:#e9f5ef}.tag-none{color:#475467;background:#f2f4f7}@media(max-width:800px){body{font-size:17px}.piegrid{grid-template-columns:1fr 1fr}.pie{width:150px;height:150px}.wrap{padding:14px 12px 96px}.big{font-size:38px}.subgrid,.cards{grid-template-columns:1fr 1fr}.next{grid-template-columns:1fr}.desktop{display:none}header{padding:12px}.brand{font-size:18px}.hero{padding:18px}}@media(max-width:430px){.piegrid{grid-template-columns:1fr}.pie{width:180px;height:180px}.subgrid{grid-template-columns:1fr 1fr}.metric{padding:13px}.metric b{font-size:20px}.big{font-size:36px}}

.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;font-size:14px;color:var(--muted);font-weight:700;margin-bottom:5px}.field input,.field select{width:100%;font-size:17px;padding:11px;border:1px solid var(--line);border-radius:10px;background:#fff}.wide{grid-column:1/-1}.primary{background:var(--accent)!important;color:#fff!important;border:0!important}.dangerbtn{color:var(--danger)}.rowactions button{font-size:13px;padding:5px 8px;margin-left:4px}.notice{padding:10px 12px;border-radius:10px;background:#fff8e6;color:#7a5200;font-size:14px;margin:10px 0}.mini{font-size:14px}.empty{padding:24px;text-align:center;color:var(--muted)}@media(max-width:600px){.formgrid{grid-template-columns:1fr}.wide{grid-column:auto}.amount{font-size:10px!important}}

.authscreen{position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}.authcard{width:min(100%,480px);background:#fff;border:1px solid var(--line);border-radius:22px;padding:24px}.authcard h1{font-size:26px;margin:0 0 8px}.authcard input{width:100%;font-size:17px;padding:12px;border:1px solid var(--line);border-radius:10px;margin:6px 0 12px}.statusbox{margin-top:14px;padding:12px;border-radius:10px;background:#f2f4f7;font-size:14px}.userbar{font-size:13px;color:var(--muted)}
.importbox{margin-top:10px}.importsummary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}.importsummary>div{background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:10px}.importpreview{overflow:auto;max-height:360px;border:1px solid var(--line);border-radius:12px}.importpreview table{font-size:13px;min-width:900px}.importpreview th,.importpreview td{padding:8px;white-space:nowrap}.oktext{color:var(--accent);font-weight:700}.errtext{color:var(--danger);font-weight:700}@media(max-width:600px){.importsummary{grid-template-columns:1fr}.importpreview{max-height:300px}}

.asset-tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;-webkit-overflow-scrolling:touch}

.asset-tabs button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.asset-card{margin-bottom:10px}.asset-row{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}

.asset-actions button{padding:7px 10px;font-size:13px}

<div class="authscreen" id="authScreen"><div class="authcard"><h1>配当ポートフォリオ</h1><p class="muted">PWA家族共有 v0.9.5.2</p><div id="setupBox"><div class="field"><label>Project URL</label><input id="sbUrl" placeholder="https://xxxxx.supabase.co"></div><div class="field"><label>Publishable key</label><input id="sbKey" type="password" placeholder="sb_publishable_..."></div><button class="primary close" id="saveConnection">接続設定を保存</button><div class="notice">Secret key / service_role key は入力しないでください。</div></div><div id="loginBox" class="hide"><div class="field"><label>メールアドレス</label><input id="loginEmail" type="email" autocomplete="username"></div><div class="field"><label>パスワード</label><input id="loginPassword" type="password" autocomplete="current-password"></div><button class="primary close" id="loginBtn">ログイン</button><button class="close" id="changeConnection">接続設定を変更</button></div><div class="statusbox" id="authStatus">接続設定を入力してください。</div></div></div>
<header><div><div class="brand">配当ポートフォリオ <span class="mini muted">PWA家族共有 v0.9.5.2</span></div><div class="userbar" id="userBar"></div></div><div style="display:flex;gap:8px;align-items:center"><select id="memberFilter" class="filter"></select><button id="logoutBtn" class="filter">ログアウト</button></div></header>
<div class="wrap">
<section id="home"></section>
<section id="portfolio" class="hide"></section>
<section id="dividend" class="hide"></section>
<section id="analysis" class="hide"></section>
<section id="settings" class="hide"></section>
</div>
<button class="fab" id="fab">＋</button>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<nav><div class="navin"><button class="active" data-page="home">ホーム</button><button data-page="portfolio">資産</button><button data-page="dividend">配当</button><button data-page="analysis">分析</button><button data-page="settings">設定</button></div></nav>
<script>
const KEY='dividendAppV01';
const CONN_KEY='dividendAppSupabaseConnection';
let sb=null;
let remoteContext=null;
let remoteMode=false;
let assetTypeFilter='すべて';
const seed={settings:{usdJpy:150,goal:600000,highYield:4},members:['Member A','Member B','Member C'],accounts:[
{id:'a1',member:'Member A',broker:'Webull',type:'特定'},{id:'a2',member:'Member A',broker:'SBI証券',type:'NISA'},{id:'a3',member:'Member B',broker:'楽天証券',type:'特定'},{id:'a4',member:'Member C',broker:'SBI証券',type:'NISA'}],
assets:[
{id:'ko',ticker:'KO',name:'Coca-Cola',kind:'米国株',sector:'生活必需品',currency:'USD',price:70,annualPerShare:2.04,frequency:4,months:[3,6,9,12]},
{id:'vym',ticker:'VYM',name:'Vanguard High Dividend Yield ETF',kind:'ETF',sector:'ETF/投信',currency:'USD',price:145,annualPerShare:3.6,frequency:4,months:[3,6,9,12]},
{id:'pbr',ticker:'PBR',name:'Petrobras',kind:'米国株',sector:'エネルギー',currency:'USD',price:16,annualPerShare:1.2,frequency:4,months:[3,6,9,12]},
{id:'brkb',ticker:'BRK.B',name:'Berkshire Hathaway',kind:'米国株',sector:'金融',currency:'USD',price:500,annualPerShare:0,frequency:0,months:[]},
{id:'ntt',ticker:'9432',name:'NTT',kind:'日本株',sector:'情報通信',currency:'JPY',price:160,annualPerShare:5.4,frequency:2,months:[6,12]}],
transactions:[
{id:'t1',assetId:'ko',accountId:'a1',type:'initial',date:'2026-01-01',qty:100,price:55.2,fund:'通常資金',cancelled:false},
{id:'t2',assetId:'vym',accountId:'a2',type:'initial',date:'2026-01-01',qty:50,price:120,fund:'通常資金',cancelled:false},
{id:'t3',assetId:'pbr',accountId:'a1',type:'initial',date:'2026-01-01',qty:100,price:12,fund:'通常資金',cancelled:false},
{id:'t4',assetId:'brkb',accountId:'a1',type:'initial',date:'2026-01-01',qty:5,price:410,fund:'通常資金',cancelled:false},
{id:'t5',assetId:'ntt',accountId:'a3',type:'initial',date:'2026-01-01',qty:1000,price:145,fund:'通常資金',cancelled:false}],
dividends:[
{id:'d1',assetId:'ntt',accountId:'a3',date:'2026-09-20',status:'actual',gross:2700,net:2600,currency:'JPY',fx:1,cancelled:false},
{id:'d2',assetId:'ko',accountId:'a1',date:'2026-09-30',status:'planned',gross:51,net:40.65,currency:'USD',fx:150,cancelled:false},
{id:'d3',assetId:'vym',accountId:'a2',date:'2026-10-03',status:'planned',gross:54.7,net:54.7,currency:'USD',fx:150,cancelled:false}],
priceUpdated:'2026-09-26'};
let db=JSON.parse(localStorage.getItem(KEY)||'null')||structuredClone(seed); let filter='ALL';
const yen=n=>'¥'+Math.round(n||0).toLocaleString('ja-JP'); const money=(n,c)=>c==='USD'?'$'+Number(n||0).toFixed(2):yen(n);
function save(){if(!remoteMode)localStorage.setItem(KEY,JSON.stringify(db)); renderAll()}
function acct(id){return db.accounts.find(x=>x.id===id)} function asset(id){return db.assets.find(x=>x.id===id)}
function inFilter(accountId){let a=acct(accountId);return filter==='ALL'||(a&&a.member===filter)}
function holdings(){let m={};db.transactions.filter(t=>!t.cancelled&&inFilter(t.accountId)).forEach(t=>{let k=t.assetId+'|'+t.accountId;if(!m[k])m[k]={assetId:t.assetId,accountId:t.accountId,qty:0,cost:0};let s=t.type==='sell'?-1:1;m[k].qty+=s*t.qty;m[k].cost+=s*t.qty*t.price});return Object.values(m).filter(h=>h.qty>0.000001)}
function fx(a){return a.currency==='USD'?db.settings.usdJpy:1} function valueY(h){let a=asset(h.assetId);return h.qty*a.price*fx(a)} function annualY(h){let a=asset(h.assetId);return h.qty*a.annualPerShare*fx(a)}
function totals(){let hs=holdings(), val=hs.reduce((s,h)=>s+valueY(h),0), annual=hs.reduce((s,h)=>s+annualY(h),0), incomeVal=hs.filter(h=>asset(h.assetId).annualPerShare>0).reduce((s,h)=>s+valueY(h),0);let cost=hs.reduce((s,h)=>{let a=asset(h.assetId);return s+h.cost*fx(a)},0);let actual=db.dividends.filter(d=>!d.cancelled&&d.status==='actual'&&inFilter(d.accountId)).reduce((s,d)=>s+d.net*d.fx,0);return{hs,val,annual,incomeVal,cost,actual}}
function renderFilter(){memberFilter.innerHTML='<option value="ALL">家族全体</option>'+db.members.map(m=>`<option>${m}</option>`).join('');memberFilter.value=filter}
function renderHome(){let t=totals(), hi=t.hs.filter(h=>{let a=asset(h.assetId);return a.annualPerShare>0&&annualY(h)/valueY(h)*100>=db.settings.highYield}).reduce((s,h)=>s+valueY(h),0);let lo=t.incomeVal-hi;let months=Array(12).fill(0);db.dividends.filter(d=>!d.cancelled&&inFilter(d.accountId)&&!(d.status==='planned'&&d.scheduleStatus==='受取済')).forEach(d=>months[new Date(d.date+'T00:00').getMonth()]+=d.net*d.fx);let max=Math.max(...months,1);let next=db.dividends.filter(d=>!d.cancelled&&d.status==='planned'&&d.scheduleStatus!=='受取済'&&inFilter(d.accountId)).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,3);home.innerHTML=`<div class="hero"><div class="eyebrow">2026年 年間配当・分配金見込</div><div class="big">${yen(t.annual)}</div><div class="muted">現在保有ベースの年換算</div><div class="subgrid"><div class="metric">現在ペース年換算<b>${yen(t.annual)}</b></div><div class="metric">今年受取済み<b>${yen(t.actual)}</b></div><div class="metric">配当関連資産<b>${yen(t.incomeVal)}</b></div><div class="metric">総資産評価額<b>${yen(t.val)}</b></div></div></div><div class="cards"><div class="card"><span class="pill tag-hi">高配当 ≥${db.settings.highYield}%</span><h3>${yen(hi)}</h3></div><div class="card"><span class="pill tag-div">配当あり &lt;${db.settings.highYield}%</span><h3>${yen(lo)}</h3></div><div class="card"><div class="muted">投資元本</div><h3>${yen(t.cost)}</h3><div>評価損益 ${yen(t.val-t.cost)}</div></div><div class="card"><div class="muted">登録銘柄</div><h3>${t.hs.length}</h3><div>保有ポジション</div></div></div><div class="section"><h2>年間目標</h2><div class="card"><strong>${yen(t.annual)} / ${yen(db.settings.goal)}</strong><span style="float:right">${(t.annual/db.settings.goal*100).toFixed(1)}%</span><div class="progress"><i style="width:${Math.min(100,t.annual/db.settings.goal*100)}%"></i></div></div></div><div class="section"><h2>次の配当</h2><div class="next">${next.length?next.map(d=>`<div class="card"><strong>${d.scheduleSource==='auto'?Number(d.date.slice(5,7))+'月予定':d.date.slice(5).replace('-','/')} ${asset(d.assetId).ticker}</strong><div>予定 約 ${yen(d.net*d.fx)}</div><div class="muted">${money(d.gross,d.currency)}</div></div>`).join(''):'<div class="card">予定なし</div>'}</div></div><div class="section"><h2>月別 配当・分配金</h2><div class="card"><div class="chart">${months.map((v,i)=>`<div class="bar" style="height:${Math.max(8,v/max*100)}%"><span class="amount">${yen(v)}</span><span class="month">${i+1}月</span></div>`).join('')}</div></div></div>`}
function assetGroup(a){
 const k=(a?.kind||'その他').trim();
 if(k==='日本株')return '日本株';
 if(k==='米国株')return '米国株';
 if(k.includes('ETF'))return 'ETF';
 if(k==='投資信託')return '投資信託';
 if(k==='MMF')return 'MMF';
 if(k==='銀行預金'||k==='預金')return '銀行預金';
 return 'その他';
}
function setAssetTypeFilter(v){assetTypeFilter=v;renderPortfolio()}
function renderPortfolio(){
 let t=totals(),totalVal=t.val||0;
 const tabs=['すべて','日本株','米国株','ETF','投資信託','MMF','銀行預金','その他'];
 const hs=t.hs.filter(h=>assetTypeFilter==='すべて'||assetGroup(asset(h.assetId))===assetTypeFilter);
 portfolio.innerHTML=`<div class="section"><h2>資産</h2>
 <div class="cards" style="grid-template-columns:repeat(2,minmax(0,1fr));margin-bottom:12px">
 <div class="metric"><span class="eyebrow">資産評価額 合計</span><b>${yen(totalVal)}</b></div>
 <div class="metric"><span class="eyebrow">保有資産・口座数</span><b>${t.hs.length}</b></div></div>
 <div class="asset-tabs">${tabs.map(x=>`<button class="${assetTypeFilter===x?'active':''}" onclick="setAssetTypeFilter('${x}')">${x}</button>`).join('')}</div>
 <div class="mini muted" style="margin-bottom:10px">${assetTypeFilter}：${hs.length}件</div>
 ${hs.length?hs.map(h=>{
   let a=asset(h.assetId),ac=acct(h.accountId),v=valueY(h),share=totalVal?v/totalVal*100:0,y=v?annualY(h)/v*100:0;
   let cash=assetGroup(a)==='銀行預金'||assetGroup(a)==='MMF'; let cashRate=cash?(+a.annualPerShare||0)*100:0;
   let qtyLabel=cash?'残高':'保有株数・口数';
   let primaryLabel=cash?(a.name||a.ticker):(a.ticker||a.name);
   let secondaryLabel=cash?'':(a.name||'');
   return `<div class="card asset-card"><div class="asset-row"><div><strong>${escapeHtml(primaryLabel)}</strong>${secondaryLabel?`<div class="mini muted">${escapeHtml(secondaryLabel)}</div>`:''}<div class="asset-qty">${qtyLabel}：${Number(h.qty).toLocaleString('ja-JP',{maximumFractionDigits:6})}</div><div class="mini muted">${escapeHtml(ac.member)}｜${escapeHtml(ac.broker)} ${escapeHtml(ac.type||'')}</div></div><div style="text-align:right"><strong>${yen(v)}</strong><div class="mini muted">構成比 ${share.toFixed(1)}%</div></div></div>
   <div class="mini" style="margin-top:8px">${cash?`金利・利回り ${cashRate.toFixed(3)}%　年間利息見込 ${yen(annualY(h))}`:`現在価格 ${a.currency==='USD'?'$':''}${Number(a.price||0).toLocaleString('ja-JP')} ${escapeHtml(a.currency||'')}　年間配当 ${yen(annualY(h))}${a.annualPerShare?`　利回り ${y.toFixed(2)}%`:''}`}</div>
   <div class="asset-actions"><button onclick="adjustHoldingForm('${h.assetId}','${h.accountId}')">${cash?'残高を修正':'株数・口数を修正'}</button></div></div>`;
 }).join(''):'<div class="card empty">この分類の保有資産はありません。</div>'}
 </div>`;
}
function renderDividend(){
 let ds=db.dividends.filter(d=>!d.cancelled&&inFilter(d.accountId)).sort((a,b)=>a.date.localeCompare(b.date));
 dividend.innerHTML=`<div class="section"><h2>配当・分配金</h2>${ds.length?ds.map(d=>{
   const isActual=d.status==='actual', isReceived=d.status==='planned'&&d.scheduleStatus==='受取済';
   const label=isActual?'実績・受取済':isReceived?'予定・✓受取済':'予定';
   let actions='';
   if(d.status==='planned'&&!isReceived) actions=`<button onclick="editPlannedDividend('${d.id}')">予定を修正</button><button onclick="receiveDividend('${d.id}')">受取済みにする</button><button onclick="cancelDividend('${d.id}')">取消</button>`;

function parseDividendMonths(v){
 return [...new Set(String(v||'').split(/[,、\s]+/).map(Number).filter(n=>Number.isInteger(n)&&n>=1&&n<=12))].sort((a,b)=>a-b);
}
function estimatedNetForAccount(gross,accountType){return String(accountType||'').includes('NISA')?gross:gross*0.8}

async function generateDividendSchedules(){
 if(!remoteMode||!remoteContext)return alert('Supabaseへログインした状態で実行してください。');
 const year=new Date().getFullYear();
 const candidates=[];
 for(const h of holdings()){
   const a=asset(h.assetId),ac=acct(h.accountId),months=(a?.months||[]);
   if(!a||!ac||!a.annualPerShare||!months.length)continue;
   const grossAnnual=h.qty*a.annualPerShare;
   const grossEach=grossAnnual/months.length;
   for(const m of months){
     const date=`${year}-${String(m).padStart(2,'0')}-01`;
     candidates.push({h,a,ac,m,date,gross:grossEach,net:estimatedNetForAccount(grossEach,ac.type)});
   }
 }
 if(!candidates.length)return alert('自動生成できる予定がありません。各銘柄の年間配当・配当月を設定してください。');
 const {data:existing,error:ee}=await sb.from('dividend_schedules').select('id,account_id,security_id,expected_date,status').eq('family_id',remoteContext.family.id).gte('expected_date',`${year}-01-01`).lte('expected_date',`${year}-12-31`).neq('status','取消');
 if(ee)return alert('既存予定を確認できません：'+ee.message);
 let added=0,skipped=0,failed=[];
 for(const c of candidates){
   const dup=(existing||[]).some(x=>x.account_id===c.ac.id&&x.security_id===c.a.id&&String(x.expected_date).slice(0,7)===c.date.slice(0,7));
   if(dup){skipped++;continue;}
   const row={family_id:remoteContext.family.id,member_id:c.ac.memberId,account_id:c.ac.id,security_id:c.a.id,expected_date:c.date,quantity:c.h.qty,dividend_per_share:c.gross/c.h.qty,gross_amount:c.gross,estimated_net_amount:c.net,currency:c.a.currency,estimated_fx_rate:c.a.currency==='USD'?db.settings.usdJpy:null,status:'予定',schedule_source:'auto'};
   const {error}=await sb.from('dividend_schedules').insert(row);
   if(error)failed.push(`${c.a.ticker} ${c.m}月: ${error.message}`); else added++;
 }
 await loadRemoteData();
 alert(`月別予定配当を生成しました。\n新規 ${added}件 / 既存スキップ ${skipped}件 / 失敗 ${failed.length}件${failed.length?'\n\n'+failed.slice(0,5).join('\n'):''}`);
}

let pendingInitialImport=[];

function normText(v){return String(v??'').trim()}
function normCurrency(v){const x=normText(v).toUpperCase();return (x==='円'||x==='JPY')?'JPY':(x==='USD'||x==='US$')?'USD':x||'JPY'}
function normAccountType(v){
  const x=normText(v);
  if(x==='旧NISA'||x==='旧つみたてNISA'||x==='旧一般NISA')return 'NISA';
  return x;
}
function normAssetType(assetType,market){
  const t=normText(assetType),m=normText(market);
  if(t==='ETF')return 'ETF';
  if(t==='投資信託')return '投資信託';
  if(t==='個別株')return m==='米国株'?'米国株':'日本株';
  return t||m||'その他';
}
function headerValue(row,names){for(const n of names){if(Object.prototype.hasOwnProperty.call(row,n))return row[n]}return ''}
function num(v){if(v===null||v===undefined||v==='')return 0;const n=Number(String(v).replace(/,/g,''));return Number.isFinite(n)?n:0}

async function previewInitialAssets(){
  const out=document.getElementById('importResult'), input=document.getElementById('initialAssetFile');
  pendingInitialImport=[];
  if(!remoteMode){out.innerHTML='<div class="notice errtext">Supabaseへログインした状態で実行してください。</div>';return}
  if(!input?.files?.[0]){out.innerHTML='<div class="notice">Excelファイルを選択してください。</div>';return}
  if(typeof XLSX==='undefined'){out.innerHTML='<div class="notice errtext">Excel読込ライブラリを読み込めません。インターネット接続を確認してください。</div>';return}
  try{
    const buf=await input.files[0].arrayBuffer(), book=XLSX.read(buf,{type:'array'});
    const sheet=book.Sheets['初期資産入力']||book.Sheets[book.SheetNames[0]];
    const rows=XLSX.utils.sheet_to_json(sheet,{defval:''});
    const memberByName=new Map((db.members||[]).map(x=>[normText(x),x]));
    const parsed=rows.map((r,i)=>{
      const member=normText(headerValue(r,['誰の資産？','家族']));
      const assetType=normText(headerValue(r,['資産種別']));
      const broker=normText(headerValue(r,['証券会社']));
      const accountType=normText(headerValue(r,['口座区分']));
      const market=normText(headerValue(r,['市場']));
      const symbolOrFund=normText(headerValue(r,['銘柄コード・ファンド名','銘柄コード']));
      const nameInput=normText(headerValue(r,['銘柄名（任意）','銘柄名']));
      const qty=num(headerValue(r,['現在の保有数量','保有数量']));
      const inputPrice=num(headerValue(r,['平均取得単価・取得価額','平均取得単価']));
      const currency=normCurrency(headerValue(r,['取得通貨','通貨']));
      const acquisitionAmount=num(headerValue(r,['取得金額（任意）','取得金額']));
      const kind=normAssetType(assetType,market);
      const isFund=kind==='投資信託';
      // 国内投資信託の取得価額は通常1万口当たり。DB内では1口当たりへ正規化する。
      const price=inputPrice>0 ? (isFund ? inputPrice/10000 : inputPrice) : (acquisitionAmount>0&&qty>0 ? acquisitionAmount/qty : 0);
      const symbol=isFund ? symbolOrFund : symbolOrFund.toUpperCase();
      const name=isFund ? (nameInput||symbolOrFund) : (nameInput||symbol);
      const errors=[];
      if(!member)errors.push('家族名なし'); else if(!memberByName.has(member))errors.push('家族名がSupabaseと不一致');
      if(!broker)errors.push('証券会社なし');
      if(!accountType)errors.push('口座区分なし');
      if(!symbol)errors.push('銘柄/ファンド名なし');
      if(qty<=0)errors.push('保有数量なし');
      if(price<=0)errors.push('取得単価なし');
      if(!['JPY','USD'].includes(currency))errors.push('通貨を確認');
      return {row:i+2,member,assetType:kind,broker,accountType,market,symbol,name,qty,inputPrice,price,currency,acquisitionAmount,errors};
    }).filter(x=>x.member||x.broker||x.symbol||x.qty||x.inputPrice);
    pendingInitialImport=parsed;
    renderImportPreview();
  }catch(e){out.innerHTML='<div class="notice errtext">Excelを読み込めません：'+escapeHtml(e.message)+'</div>'}
}
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function renderImportPreview(){
  const out=document.getElementById('importResult');if(!out)return;
  const ok=pendingInitialImport.filter(x=>!x.errors.length), ng=pendingInitialImport.filter(x=>x.errors.length);
  out.innerHTML=`<div class="importsummary"><div>読込行数<br><strong>${pendingInitialImport.length}</strong></div><div>登録可能<br><strong class="oktext">${ok.length}</strong></div><div>要確認<br><strong class="${ng.length?'errtext':'oktext'}">${ng.length}</strong></div></div>
  <div class="importpreview"><table><thead><tr><th>行</th><th>家族</th><th>種別</th><th>証券会社</th><th>口座</th><th>銘柄/ファンド</th><th>数量</th><th>取得価額</th><th>通貨</th><th>判定</th></tr></thead><tbody>${pendingInitialImport.map(x=>`<tr><td>${x.row}</td><td>${escapeHtml(x.member)}</td><td>${escapeHtml(x.assetType)}</td><td>${escapeHtml(x.broker)}</td><td>${escapeHtml(x.accountType)}</td><td>${escapeHtml(x.symbol)}</td><td>${x.qty}</td><td>${x.inputPrice||x.price}</td><td>${x.currency}</td><td class="${x.errors.length?'errtext':'oktext'}">${x.errors.length?escapeHtml(x.errors.join(' / ')):'OK'}</td></tr>`).join('')}</tbody></table></div>
  ${ng.length?'<div class="notice">要確認の行があります。Excelを修正して再読込してください。Supabaseにはまだ何も保存されていません。</div>':`<button class="primary close" onclick="commitInitialAssets()">この内容をSupabaseへ登録</button><div class="mini muted">登録前に既存データとの重複を再確認します。</div>`}`;
}

async function commitInitialAssets(){
  if(!remoteMode||!remoteContext)return alert('Supabaseへログインしてください。');
  if(!pendingInitialImport.length||pendingInitialImport.some(x=>x.errors.length))return alert('登録できない行があります。');
  if(!confirm(`${pendingInitialImport.length}行を確認します。既存の初期残高はスキップし、新規分だけSupabaseへ登録します。よろしいですか？`))return;

  const fid=remoteContext.family.id;
  const {data:members,error:me}=await sb.from('family_members').select('id,display_name').eq('family_id',fid);
  if(me)return alert('家族情報を確認できません：'+me.message);
  const memberMap=new Map((members||[]).map(x=>[normText(x.display_name),x.id]));

  const {data:existingAccounts,error:ae}=await sb.from('brokerage_accounts').select('*').eq('family_id',fid);
  if(ae)return alert('口座情報を確認できません：'+ae.message);
  const {data:existingSecs,error:se}=await sb.from('securities').select('*').eq('family_id',fid);
  if(se)return alert('銘柄情報を確認できません：'+se.message);
  const {data:existingTx,error:te}=await sb.from('transactions').select('id,member_id,account_id,security_id,transaction_type,status').eq('family_id',fid).eq('status','active');
  if(te)return alert('取引情報を確認できません：'+te.message);

  const accounts=[...(existingAccounts||[])], secs=[...(existingSecs||[])], txs=[...(existingTx||[])];
  let addedAccounts=0,addedSecs=0,addedTx=0,skipped=0;
  const failures=[];

  for(const x of pendingInitialImport){
    try{
      const mid=memberMap.get(x.member);
      if(!mid){failures.push({row:x.row,symbol:x.symbol,reason:`${x.member} がfamily_membersにありません`});continue;}

      const dbAccountType=normAccountType(x.accountType);
      let ac=accounts.find(a=>a.member_id===mid&&normText(a.broker_name)===x.broker&&normText(a.account_name||a.account_type)===x.accountType);
      if(!ac){
        const {data,error}=await sb.from('brokerage_accounts').insert({family_id:fid,member_id:mid,broker_name:x.broker,account_name:x.accountType,account_type:dbAccountType,currency:x.currency,is_active:true}).select().single();
        if(error){failures.push({row:x.row,symbol:x.symbol,reason:'口座登録：'+error.message});continue;}
        ac=data;accounts.push(ac);addedAccounts++;
      }

      let sec=secs.find(a=>normText(a.symbol).toUpperCase()===normText(x.symbol).toUpperCase());
      if(!sec){
        const {data,error}=await sb.from('securities').insert({family_id:fid,symbol:x.symbol,name:x.name,asset_type:x.assetType,currency:x.currency,sector:x.assetType==='投資信託'?'ETF/投信':'未分類',current_price:x.price,annual_dividend_per_share:0,dividend_frequency:0,dividend_status:'据置',is_active:true}).select().single();
        if(error){failures.push({row:x.row,symbol:x.symbol,reason:'銘柄登録：'+error.message});continue;}
        sec=data;secs.push(sec);addedSecs++;
      }

      const duplicate=txs.some(t=>t.member_id===mid&&t.account_id===ac.id&&t.security_id===sec.id&&t.transaction_type==='initial');
      if(duplicate){skipped++;continue;}

      const row={family_id:fid,member_id:mid,account_id:ac.id,security_id:sec.id,transaction_type:'initial',trade_date:new Date().toISOString().slice(0,10),quantity:x.qty,price:x.price,currency:x.currency,funding_source:'通常資金',status:'active',created_by:remoteContext.user.id};
      const {data,error}=await sb.from('transactions').insert(row).select('id,member_id,account_id,security_id,transaction_type,status').single();
      if(error){failures.push({row:x.row,symbol:x.symbol,reason:'初期残高登録：'+error.message});continue;}
      txs.push(data);addedTx++;
    }catch(e){
      failures.push({row:x.row,symbol:x.symbol,reason:String(e?.message||e)});
    }
  }

  // 登録後に市場情報を取得。コード名のまま登録された既存銘柄も、
  // bright-task 側の名称補完ロジックで正式名称へ更新される。
  let marketMessage='';
  try{
    const {data,error}=await sb.functions.invoke('bright-task',{body:{action:'update-securities'}});
    if(error)throw error;
    const results=Array.isArray(data?.results)?data.results:[];
    const marketOk=results.filter(r=>r.ok&&!r.skipped).length;
    const marketSkipped=results.filter(r=>r.skipped).length;
    const marketNg=results.filter(r=>!r.ok).length;
    marketMessage=`\n市場情報更新：成功 ${marketOk}件 / 対象外 ${marketSkipped}件 / 失敗 ${marketNg}件`;
  }catch(e){
    marketMessage=`\n市場情報更新：失敗（登録データは保存済み）`;
  }

  pendingInitialImport=[];
  await loadRemoteData();

  const failText=failures.length
    ? '\n\n失敗した行：\n'+failures.slice(0,8).map(f=>`行${f.row} ${f.symbol}：${f.reason}`).join('\n')+(failures.length>8?`\nほか ${failures.length-8}件`:'')
    : '';
  alert(`登録処理完了\n新規初期残高 ${addedTx}件\n既存スキップ ${skipped}件\n登録失敗 ${failures.length}件\n新規銘柄 ${addedSecs}件 / 新規口座 ${addedAccounts}件${marketMessage}${failText}`);
}

    sb.from('transactions').select('*').eq('family_id',remoteContext.family.id).eq('status','active'),
    sb.from('dividend_schedules').select('*').eq('family_id',remoteContext.family.id).neq('status','取消'),
    sb.from('dividend_payments').select('*').eq('family_id',remoteContext.family.id).eq('status','active'),

  ]);
  const err=[mres,ares,sres,tres,dsres,dpres].find(x=>x.error)?.error;if(err){alert('Supabaseデータ読込エラー：'+err.message);return;}
  const memberMap=Object.fromEntries((mres.data||[]).map(x=>[x.id,x.display_name]));
  db={settings:{usdJpy:+(setres.data?.usd_jpy_planning_rate||150),goal:+(goalres.data?.target_amount_jpy||0),highYield:+(setres.data?.high_dividend_threshold||4)},members:(mres.data||[]).map(x=>x.display_name),memberRecords:(mres.data||[]).map(x=>({id:x.id,display_name:x.display_name})),accounts:(ares.data||[]).map(x=>({id:x.id,member:memberMap[x.member_id]||'Member',memberId:x.member_id,broker:x.broker_name,type:x.account_name||x.account_type,currency:x.currency})),assets:(sres.data||[]).map(x=>({id:x.id,ticker:x.symbol,name:x.name,kind:x.asset_type,sector:x.sector||'未分類',currency:x.currency,price:+x.current_price,annualPerShare:+x.annual_dividend_per_share,frequency:x.dividend_frequency||0,dividendStatus:x.dividend_status||'据置',months:Array.isArray(x.dividend_months)?x.dividend_months:[]})),transactions:(tres.data||[]).map(x=>({id:x.id,assetId:x.security_id,accountId:x.account_id,type:x.transaction_type,date:x.trade_date,qty:+x.quantity,price:+x.price,fund:x.funding_source,cancelled:false})),dividends:[
    ...(dsres.data||[]).map(x=>({id:x.id,assetId:x.security_id,accountId:x.account_id,date:x.expected_date,status:'planned',gross:+x.gross_amount,net:+(x.estimated_net_amount??x.gross_amount),currency:x.currency,fx:x.currency==='JPY'?1:+(x.estimated_fx_rate||db?.settings?.usdJpy||150),cancelled:false,scheduleStatus:x.status,scheduleSource:x.schedule_source||'manual'})),
    ...(dpres.data||[]).map(x=>({id:x.id,assetId:x.security_id,accountId:x.account_id,date:x.payment_date,status:'actual',gross:+x.gross_amount,net:+x.net_amount,currency:x.currency,fx:x.currency==='JPY'?1:+(x.fx_rate||1),cancelled:false,distributionType:x.distribution_type||'配当'}))
  ],priceUpdated:new Date().toISOString().slice(0,10)};
  remoteMode=true;filter='ALL';renderAll();
}

async function initSupabase(){
  const cfg=JSON.parse(localStorage.getItem(CONN_KEY)||'null');
  if(!cfg?.url||!cfg?.key){authStatus.textContent='接続設定を入力してください。';setupBox.classList.remove('hide');loginBox.classList.add('hide');return;}
  try{
    sb=window.supabase.createClient(cfg.url,cfg.key);
    setupBox.classList.add('hide');loginBox.classList.remove('hide');
    authStatus.textContent='接続設定済み。ログインしてください。';
    const {data:{session}}=await sb.auth.getSession();
    if(session) await afterLogin(session.user);
  }catch(e){authStatus.textContent='接続設定を確認してください：'+e.message;}
}
async function afterLogin(user){
  authStatus.textContent='ログイン確認中…';
  const {data:member,error}=await sb.from('family_members').select('id,family_id,display_name,role').eq('user_id',user.id).single();
  if(error){authStatus.textContent='ログインは成功しましたが、Member情報を取得できません：'+error.message;return;}
  const {data:family,error:ferr}=await sb.from('families').select('id,name').eq('id',member.family_id).single();
  if(ferr){authStatus.textContent='Family情報を取得できません：'+ferr.message;return;}
  remoteContext={user,member,family};
  userBar.textContent=`${member.display_name} ｜ ${family.name} ｜ ${member.role}`;
  authScreen.style.display='none';
  await loadRemoteData();
  renderAll();
}
